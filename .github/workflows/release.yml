name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que le tag correspond à la version du manifest
        run: |
          v=$(jq -r .version custom_components/flowio/manifest.json)
          test "v$v" = "${GITHUB_REF_NAME}"

      - name: Vérifier la présence des cartes
        run: test -f cards/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: cards/.nvmrc
          cache: npm
          cache-dependency-path: cards/package-lock.json

      - name: Tests et build des cartes
        working-directory: cards
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm test
          npx playwright install --with-deps chromium
          npm run test:e2e
          npm run build

      - name: Mentions de licences des cartes
        working-directory: cards
        run: |
          shopt -s nocaseglob nullglob
          version=$(jq -r .version ../custom_components/flowio/manifest.json)
          count=0
          {
            echo "Third-party notices for Flow.io Home Assistant Cards ${version}"
            echo "Copied from the production dependencies installed for this build."
            for dir in $(npm ls --omit=dev --all --parseable | tail -n +2 | sort -u); do
              name=$(jq -r '.name + " " + .version' "$dir/package.json")
              found=0
              echo
              echo "--------------------"
              echo
              echo "$name"
              for file in "$dir"/licen[sc]e* "$dir"/copying* "$dir"/notice*; do
                if [ -f "$file" ]; then
                  found=1
                  echo
                  basename "$file"
                  cat "$file"
                fi
              done
              if [ "$found" = 0 ]; then
                license=$(jq -r '.license // empty' "$dir/package.json")
                if [ -z "$license" ]; then
                  echo "Aucun fichier de licence ni champ license pour $name" >&2
                  exit 1
                fi
                echo
                echo "Licence déclarée : $license"
              fi
              count=$((count + 1))
            done
          } > dist/THIRD_PARTY_NOTICES.txt
          test "$count" -gt 0
          {
            printf '\n/*!\nFlow.io Home Assistant Cards %s\nSource: %s\n\n' "$version" "$GITHUB_SHA"
            { cat LICENSE; echo; cat dist/THIRD_PARTY_NOTICES.txt; } | sed 's#\*/#* /#g'
            printf '\n*/\n'
          } >> dist/flowio-home-assistant-cards.js

      - name: Copier le bundle dans l'intégration
        run: |
          mkdir -p custom_components/flowio/frontend
          cp cards/dist/flowio-home-assistant-cards.js cards/dist/THIRD_PARTY_NOTICES.txt custom_components/flowio/frontend/

      - name: Créer l'archive
        run: cd custom_components/flowio && zip -r ../../flowio.zip .

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: flowio.zip
