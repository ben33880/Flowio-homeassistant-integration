name: Tests des cartes

on:
  push:
    branches:
      - main
      - config-unifiee
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: cards/.nvmrc
          cache: npm
          cache-dependency-path: cards/package-lock.json

      - name: Vérification TypeScript et tests unitaires
        working-directory: cards
        run: |
          npm ci
          npm run check
          npm test
