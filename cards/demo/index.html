<!doctype html><html lang=fr><head><meta charset=utf-8><meta name=viewport content="width=device-width, initial-scale=1"><title>Flow.io · Affichage explicite</title><style>
:root{color-scheme:light;--primary-text-color:#202124;--secondary-text-color:#60656d;--primary-color:#0074b8;--error-color:#b3261e;--divider-color:#d8dde3;--card-background-color:#fff;--secondary-background-color:#f3f5f7;--ha-card-border-radius:18px;background:#eef1f5;color:var(--primary-text-color);font-family:system-ui,sans-serif}
:root.dark{color-scheme:dark;--primary-text-color:#e6eaf0;--secondary-text-color:#a3adba;--primary-color:#69c7ff;--error-color:#ffb4ab;--divider-color:#39424e;--card-background-color:#202833;--secondary-background-color:#27313e;background:#141a22}body{margin:0;padding:20px}main{max-width:820px;margin:auto}nav{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}label{display:flex;align-items:center;gap:8px}select,button{font:inherit;padding:8px}p{line-height:1.5}#events{overflow-wrap:anywhere;font-size:.8rem}
</style></head><body><main><h1>Flow.io · Choix d’affichage</h1><p>Données fictives, sans connexion HA ou MQTT ni commande physique. Les contrôles HA sont simulés dans cette démo uniquement.</p><nav><label>Préfixe<select id=prefix><option>fio</option><option>piscine</option></select></label><label>État firmware simulé<select id=treatment><option value=chlorine>Chlore</option><option value=electrolysis>Électrolyse</option><option value=oxygen>Oxygène actif</option><option value=none>Désactivé</option></select></label><button id=theme>Changer de thème</button><button id=offline>Simuler hors ligne</button></nav><flowio-pool-card></flowio-pool-card><p id=events aria-live=polite></p></main><script type=module>
import '/demo/ha-switch.js';
import '/dist/flowio-home-assistant-cards.js';
if(!customElements.get('ha-card'))customElements.define('ha-card',class extends HTMLElement{constructor(){super();this.attachShadow({mode:'open'}).innerHTML='<style>:host{display:block;background:var(--card-background-color);border:1px solid var(--divider-color);border-radius:var(--ha-card-border-radius)}</style><slot></slot>';}});
const config={type:'custom:flowio-pool-card',title:'Piscine · Jardin',display:{measurements:['water_temperature','ph','orp','pressure'],setpoints:['ph_setpoint','orp_setpoint'],equipment:['filtration','ph_pump','disinfection_pump','lighting','robot'],tanks:['ph_tank','ph_tank_percent','disinfection_tank','disinfection_tank_percent'],information:['treatment_type','alarm_active','alarm_count','diagnostics']}};
let activePrefix='fio',treatment='chlorine',connectionToken='';const names={chlorine:'Chlore/Brome',electrolysis:'Electrolyse',oxygen:'Oxygène actif',none:'Désactivé'};
const installation={prefix:'fio',ph_slot:1,disinfection_slot:2,filtration_slot:0,mqtt_root:'',thresholds:{ph_good_min:7,ph_good_max:7.4,ph_mid_min:6.8,ph_mid_max:7.6,orp_good_min:650,orp_good_max:750,orp_mid_min:600,orp_mid_max:800,temp_min:16,temp_max:30,tank_min:20,offline_min:30}};
const entity=(state,unit,attributes={})=>({state,attributes:{...(unit?{unit_of_measurement:unit}:{}),...attributes}}),choice=(state,options)=>({state,attributes:{options}}),id=(domain,suffix)=>`${domain}.${activePrefix?activePrefix+'_':''}${suffix}`;
function makeStates(){const definitions={'sensor.io_wat_tmp':entity('27.4','°C',{min:0,max:40}),'sensor.io_air_tmp':entity('22.1','°C',{min:-10,max:50}),'sensor.io_ph':entity('7.2','',{min:6,max:8.4}),'sensor.io_orp':entity('710','mV',{min:400,max:1000}),'sensor.io_psi':entity('12.3','psi',{min:0.15,max:1.8}),'number.pl_ph_setpoint':entity('7.2'),'number.pl_dis_setpoint':entity('700','mV'),'switch.io_flt_pmp':entity('on'),'switch.io_ph_pmp':entity('off'),'switch.io_chl_pmp':entity('off'),'switch.io_chl_gen':entity('off'),'switch.io_lights':entity('off'),'switch.io_robot':entity('off'),'switch.io_wat_htr':entity('off'),'switch.io_fill_pmp':entity('off'),'switch.pl_modes_auto':entity('on'),'switch.pl_modes_winter':entity('off'),'switch.pl_ph_auto_mode':entity('on'),'switch.pl_dis_auto':entity('on'),'switch.pl_heat_auto':entity('off'),'switch.pl_ph_dose_plus':entity('off'),'switch.pl_o2_temp_comp':entity('on'),'binary_sensor.alm_any_active':entity('off'),'sensor.alm_active_count':entity('0'),'select.pl_modes_dis':choice(names[treatment],['Désactivé','Chlore/Brome','Electrolyse','Oxygène actif']),'select.pl_swg_ctrl':choice('Continu sur filtration',['Suivi consigne ORP','Continu sur filtration']),'sensor.data_114':entity('12.6','L'),'sensor.data_115':entity('63','%'),'sensor.data_116':entity('8.3','L'),'sensor.data_117':entity('41.5','%')};return Object.fromEntries(Object.entries(definitions).map(([key,value])=>{const [domain,suffix]=key.split('.');return [id(domain,suffix),value];}));}
const calls=[],card=document.querySelector('flowio-pool-card'),callWS=async(msg)=>{if(msg.type==='flowio/config')return{installations:[{...installation,prefix:activePrefix}]};throw new Error('Commande WebSocket de démo inconnue : '+msg.type);};
const hass={states:makeStates(),callService:async(domain,service,data)=>{calls.push({domain,service,data});document.querySelector('#events').textContent='Action simulée : '+JSON.stringify(calls.at(-1));},callWS};
function apply(){const token=`${activePrefix}|${installation.mqtt_root}`;if(token!==connectionToken){connectionToken=token;hass.connection={...(hass.connection??{}),flowioConfig:token};}card.setConfig(config);card.hass={...hass,states:{...hass.states}};}window.demo={config,hass,card,calls,apply,id,installation};
card.addEventListener('hass-more-info',e=>document.querySelector('#events').textContent='Détail demandé : '+e.detail.entityId);
document.querySelector('#prefix').addEventListener('change',e=>{activePrefix=e.target.value;hass.states=makeStates();apply();});
document.querySelector('#treatment').addEventListener('change',e=>{treatment=e.target.value;const key=id('select','pl_modes_dis');hass.states[key]={...hass.states[key],state:names[treatment]};apply();});
document.querySelector('#theme').addEventListener('click',()=>document.documentElement.classList.toggle('dark'));
document.querySelector('#offline').addEventListener('click',()=>{hass.states=Object.fromEntries(Object.entries(hass.states).map(([key,state])=>[key,{...state,state:'unavailable'}]));apply();});apply();
</script></body></html>
